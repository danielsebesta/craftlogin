name: craftlogin

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      HTTP_TRUST_PROXY: ${HTTP_TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MC_BASE_DOMAIN: ${MC_BASE_DOMAIN:-}
      MC_HOST: 0.0.0.0
      MC_PORT: 25565
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      NODE_ENV: production
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS: ${OIDC_JWKS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health', {signal:AbortSignal.timeout(2000)}).then((response)
          => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    ports:
      - '${HTTP_PUBLIC_PORT:-3000}:3000'
      - '${MC_PUBLIC_PORT:-25565}:25565'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Nothing under /app is writable state; prisma migrate needs only /tmp and a
    # scratch HOME for its telemetry cache.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /home/node:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 1g
    pids_limit: 512

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-craftlogin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-craftlogin}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    # Ephemeral state only: no RDB/AOF writes, so a compromised or crashed
    # Redis loses nothing durable. REDIS_PASSWORD is optional — the service is
    # loopback-bound either way; when set, REDIS_URL must carry the password.
    command:
      - sh
      - -c
      - >-
        exec redis-server --save '' --appendonly no $${REDIS_PASSWORD:+--requirepass
        "$${REDIS_PASSWORD}"}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli $${REDIS_PASSWORD:+-a "$${REDIS_PASSWORD}"} --no-auth-warning ping | grep -q
          PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128

volumes:
  postgres-data:
