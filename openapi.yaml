openapi: 3.1.0
info:
  description: OAuth 2.0 and OpenID Connect identity for Minecraft Java Edition accounts.
  license:
    name: MIT
  title: CraftLogin API
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      scheme: bearer
      type: http
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://craftlogin.com/oauth2/authorize
          scopes:
            offline_access: Maintain delegated access with refresh-token rotation.
            openid: Authenticate the Minecraft account.
            profile: Read the current Minecraft username and avatar.
          tokenUrl: https://craftlogin.com/oauth2/token
      type: oauth2
  schemas:
    craftlogin.error-response:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    craftlogin.user-response:
      additionalProperties: false
      properties:
        username:
          maxLength: 16
          minLength: 1
          type: string
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - username
      type: object
paths:
  /api/avatars/{uuid}/skin:
    get:
      summary: Get a Minecraft skin
      tags:
        - Avatars
      description: Return the current signed Mojang skin for a Minecraft UUID.
      parameters:
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/face:
    get:
      summary: Render a Minecraft face
      tags:
        - Avatars
      description: Render the front eight-by-eight face with its transparent Minecraft
        head overlay.
      parameters:
        - schema:
            default: all
            enum:
              - base
              - all
            type: string
          in: query
          name: layers
          required: false
        - schema:
            default: "128"
            enum:
              - "32"
              - "64"
              - "128"
              - "256"
            type: string
          in: query
          name: size
          required: false
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/head:
    get:
      summary: Render a Minecraft head
      tags:
        - Avatars
      description: Render a flat front-facing head from its current signed skin.
      parameters:
        - schema:
            default: all
            enum:
              - base
              - all
            type: string
          in: query
          name: layers
          required: false
        - schema:
            default: "128"
            enum:
              - "32"
              - "64"
              - "128"
              - "256"
            type: string
          in: query
          name: size
          required: false
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/bust:
    get:
      summary: Render a Minecraft bust
      tags:
        - Avatars
      description: Render a flat front view of the head, torso, and arms.
      parameters:
        - schema:
            default: all
            enum:
              - base
              - all
            type: string
          in: query
          name: layers
          required: false
        - schema:
            default: "128"
            enum:
              - "32"
              - "64"
              - "128"
              - "256"
            type: string
          in: query
          name: size
          required: false
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/body:
    get:
      summary: Render a Minecraft body
      tags:
        - Avatars
      description: Render a flat front view of the full player from its current signed skin.
      parameters:
        - schema:
            default: all
            enum:
              - base
              - all
            type: string
          in: query
          name: layers
          required: false
        - schema:
            default: "128"
            enum:
              - "32"
              - "64"
              - "128"
              - "256"
            type: string
          in: query
          name: size
          required: false
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/processed-skin:
    get:
      summary: Get a normalized Minecraft skin
      tags:
        - Avatars
      description: "Return the normalized 64x64 skin: legacy layouts converted, base
        layers opaque, fully-opaque overlays cleared."
      parameters:
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/cape:
    get:
      summary: Get a Minecraft cape
      tags:
        - Avatars
      description: Return the account's current cape texture, if the player wears one.
      parameters:
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/avatars/{uuid}/elytra:
    get:
      summary: Get a Minecraft elytra texture
      tags:
        - Avatars
      description: Return the elytra wing texture, which matches the worn cape texture.
      parameters:
        - schema:
            pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: uuid
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
            etag:
              schema:
                type: string
          content:
            image/png:
              schema:
                format: binary
                type: string
        "304":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /oauth2/authorize:
    get:
      summary: Authorize
      tags:
        - OAuth
      description: Begin or resume an OAuth 2.0 authorization-code flow.
      parameters:
        - schema:
            type: string
          in: query
          name: client_id
          required: true
        - schema:
            type: string
          in: query
          name: code_challenge
          required: true
        - schema:
            enum:
              - S256
            type: string
          in: query
          name: code_challenge_method
          required: true
        - schema:
            type: string
          in: query
          name: prompt
          required: false
        - schema:
            format: uri
            type: string
          in: query
          name: redirect_uri
          required: true
        - schema:
            enum:
              - code
            type: string
          in: query
          name: response_type
          required: true
        - schema:
            type: string
          in: query
          name: scope
          required: true
        - schema:
            maxLength: 1024
            minLength: 1
            type: string
          in: query
          name: state
          required: true
      responses:
        "302":
          description: Default Response
        "303":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
  /oauth2/token:
    post:
      summary: Exchange a token
      tags:
        - OAuth
      description: Redeem a single-use authorization code or rotate a refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties: false
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  type: string
                code_verifier:
                  type: string
                grant_type:
                  enum:
                    - authorization_code
                    - refresh_token
                  type: string
                redirect_uri:
                  format: uri
                  type: string
                refresh_token:
                  type: string
              required:
                - grant_type
              type: object
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  access_token:
                    type: string
                  expires_in:
                    minimum: 1
                    type: integer
                  id_token:
                    type: string
                  refresh_token:
                    type: string
                  scope:
                    type: string
                  token_type:
                    type: string
                required:
                  - access_token
                  - token_type
                type: object
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /oauth2/introspect:
    post:
      summary: Introspect a token
      tags:
        - OAuth
      description: Inspect an access or refresh token issued to the authenticated client.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties: false
              properties:
                token:
                  type: string
                token_type_hint:
                  enum:
                    - access_token
                    - refresh_token
                  type: string
              required:
                - token
              type: object
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /oauth2/logout:
    get: &a1
      summary: End the provider session
      tags:
        - OAuth
      description: End the CraftLogin provider session using RP-initiated logout.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
        "303":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
    post: *a1
  /oauth2/revoke:
    post:
      summary: Revoke a token
      tags:
        - OAuth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties: false
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                token:
                  type: string
                token_type_hint:
                  enum:
                    - access_token
                    - refresh_token
                  type: string
              required:
                - token
              type: object
      responses:
        "200":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
  /oauth2/userinfo:
    get: &a2
      summary: Get OIDC UserInfo
      tags:
        - OAuth
      description: Return standard OIDC claims for an OpenID-scoped access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
    post: *a2
  /oauth2/jwks:
    get:
      summary: Get signing keys
      tags:
        - OAuth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  keys:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                required:
                  - keys
                type: object
  /.well-known/openid-configuration:
    get:
      summary: Get authorization server metadata
      tags: &a3
        - OAuth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /.well-known/oauth-authorization-server:
    get:
      summary: Get authorization server metadata
      tags: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /.well-known/webfinger:
    get:
      summary: Resolve issuer metadata
      tags:
        - OAuth
      parameters:
        - schema:
            type: string
          in: query
          name: rel
          required: false
        - schema:
            type: string
          in: query
          name: resource
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                type: object
  /api/users/@me:
    get:
      summary: Get the current Minecraft user
      tags:
        - Identity
      description: Return the Minecraft UUID and current username represented by the
        access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.user-response"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
  /api/users/{identifier}:
    get:
      summary: Resolve a Minecraft player
      tags:
        - Identity
      description: Resolve a Minecraft Java username or UUID. Unknown usernames return
        an offline-mode UUID with a deterministic default skin; that synthetic
        profile is never a verified identity.
      parameters:
        - schema:
            pattern: ^(?:[A-Za-z0-9_]{3,16}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-fA-F]{32})$
            type: string
          in: path
          name: identifier
          required: true
      responses:
        "200":
          description: Default Response
          headers:
            cache-control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.user-response"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/craftlogin.error-response"
servers:
  - url: https://craftlogin.com
tags:
  - description: Standards-based OAuth 2.0 and OpenID Connect endpoints.
    name: OAuth
  - description: Resolve public Minecraft identities or read the identity
      represented by a token.
    name: Identity
  - description: Fetch and render signed Minecraft skins without authentication.
    name: Avatars
