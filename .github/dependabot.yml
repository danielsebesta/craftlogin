version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    # Major bumps land as individual PRs so each gets a deliberate review.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
